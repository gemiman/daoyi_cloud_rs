[package]
name = "daoyi_cloud_rs"
version = "0.1.1"
edition = "2024"
rust-version = "1.92.0"
readme = "./README.md"

[dependencies]
anyhow = "1.0.100"
figment = { version = "0.10.19", features = ["env", "toml"] }
jsonwebtoken = {version = "10.2.0", features = ["rust_crypto"]}
rust-embed = "8.9.0"
salvo = {version = "0.85.0", features = ["anyhow", "cookie", "cors", "jwt-auth", "oapi", "serve-static", "rustls", "logging", "test"]}
serde = "1.0.228"
thiserror = "2.0.17"
time = "0.3.44"
tokio = {version = "1.48.0", features = ["full"]}
tracing = "0.1.43"
validator = {version = "0.20.0", features = ["derive"]}
ulid = "1.2.1"
argon2 = { version = "0.6.0-rc.5",features = ["getrandom"] }
cookie = "0.18.1"
dotenvy = "0.15.7"
tracing-appender ="0.2.4"
tracing-subscriber = {version = "0.3.22", features = ["std", "fmt", "env-filter", "tracing-log", "time", "local-time", "json"]}
rbatis = { version = "4.6.13"}
rbs = { version = "4.6.2"}
rbdc-pg = { version = "4.6.3"}
askama = "0.14.0"
rand = "0.9.2"
